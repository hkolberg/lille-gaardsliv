name: Build and deploy Godot Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Make export templates available
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -R /root/.local/share/godot/export_templates/4.4.stable "$HOME/.local/share/godot/export_templates/4.4.stable"

      - name: Import Godot project
        run: godot --headless --editor --path godot --quit

      - name: Export Web build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path godot --export-release Web "$GITHUB_WORKSPACE/build/index.html"
          touch "$GITHUB_WORKSPACE/build/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
